<!doctype html><html lang="zh-CN" data-skin="graphite"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>下一步建议</title><link rel="stylesheet" href="panel.css"></head><body><main id="app" class="app list" data-skin="graphite"><header class="head"><div id="suggestion-header"><div class="heading"><h1>下一步建议<span id="suggestion-count" class="count" hidden></span></h1><label class="auto"><input id="auto-generate" type="checkbox" disabled><span class="switch" aria-hidden="true"></span>自动建议</label></div><div class="context"><p class="thread"><span class="thread-label">对话：</span><span id="thread-title">正在连接当前聊天…</span></p><button id="refresh" class="refresh" type="button" disabled>刷新建议</button></div></div><div id="view-header" class="view-header" hidden><button id="settings-close" class="back" type="button" aria-label="返回建议">‹</button><h1 id="view-title">建议设置</h1></div></header><div id="panel-scroll" class="scroll"><section id="suggestion-view"><section id="status" class="status" role="status" aria-live="polite"><span id="status-symbol" class="status-mark" aria-hidden="true">·</span><h2 id="status-title">正在连接</h2><p id="status-detail">从当前聊天右侧打开面板。</p><div class="status-actions"><button id="status-action" class="primary" hidden></button><button id="check-model" class="quiet" hidden>检查模型</button></div></section><section id="suggestions" aria-label="下一步建议" hidden></section><p id="draft-note" class="capability-note" hidden></p></section><section id="settings" hidden><p class="settings-intro">仅用于生成后续建议，不改变当前聊天的模型。</p><form id="settings-form">
        <label class="form-field">服务来源<select id="provider"><option value="official">官方 · Codex 登录</option><option value="relay">中转 · API</option></select></label>
        <div id="relay-preset-field" class="form-field" hidden><label for="relay-preset">中转站</label><select id="relay-preset"><option value="aicodewith">AI Code With</option><option value="custom">自定义地址</option></select></div>
        <div class="form-field"><div class="field-heading"><label for="model">建议模型</label><button id="load-models" class="text-button" type="button">读取模型目录</button></div><div id="model-picker" class="model-picker"><div class="model-input-row"><input id="model" placeholder="选择或输入模型标识" autocomplete="off" required><button id="model-toggle" class="model-toggle" type="button" aria-label="选择建议模型" aria-expanded="false" aria-controls="model-menu">⌄</button></div><div id="model-menu" class="model-menu" hidden><label class="model-search-label" for="model-search">搜索模型</label><input id="model-search" type="search" placeholder="搜索模型名称或 ID" autocomplete="off"><p id="model-count" class="model-count" aria-live="polite"></p><div id="model-list" class="model-options" role="listbox" aria-label="可选模型"></div><p id="model-empty" class="form-hint" role="status" hidden></p></div></div><p id="models-status" class="form-hint">首次使用请明确选择模型。</p></div>
        <div class="form-grid"><label class="form-field">思考程度<select id="reasoning-effort"><option value="none">无</option><option value="minimal">最少</option><option value="low" selected>低</option><option value="medium">中</option><option value="high">高</option><option value="xhigh">很高</option><option value="max">最大</option><option value="ultra">Ultra</option></select></label><label class="form-field">服务档位<select id="service-tier"><option value="">Standard</option><option value="priority">Fast · Priority</option></select></label></div>
        <div id="relay-fields" hidden><label class="form-field">API 地址<input id="base-url" type="url" placeholder="https://…/v1" autocomplete="off"></label><div class="form-field"><div class="field-heading"><label for="api-key">API Key</label><button id="clear-api-key" class="text-button" type="button" aria-label="清除已保存的 API Key" aria-pressed="false" hidden>清除</button></div><input id="api-key" type="password" placeholder="粘贴中转服务的 API Key" autocomplete="new-password" spellcheck="false" maxlength="8192"><span id="api-key-status" class="form-hint" role="status">仅用于插件的中转调用，加密保存在本机。</span></div></div>
        <details class="advanced"><summary>高级设置</summary><label class="form-field">Codex 可执行文件<input id="codex-bin" placeholder="codex" autocomplete="off" spellcheck="false"></label></details>
        <p id="settings-message" class="form-hint" role="status"></p>

      </form></section><section id="usage-view" hidden><p class="usage-intro">当前聊天的调用记录</p><div class="stats"><div class="stat"><strong id="usage-calls">0</strong><span>生成尝试</span></div><div class="stat"><strong id="usage-failures">0</strong><span>历史失败</span></div></div><p id="usage" class="usage-note"></p><h2 class="section-title">最近调用</h2><div id="usage-records"></div><p class="usage-note">失败或未返回用量的调用不计为零消耗。</p></section></div><div id="savebar" class="savebar" hidden><p id="settings-dirty" hidden>有未保存的更改</p><button id="save-settings" class="primary" type="submit" form="settings-form">保存设置</button></div><footer class="footer"><div class="skinbar"><span>外观</span><div class="skin-track" role="group" aria-label="界面皮肤"><button id="skin-graphite" type="button" title="原生石墨" aria-label="切换到原生石墨皮肤" aria-pressed="false"><i class="swatch" style="background:#1C1C1C"></i>石墨</button><button id="skin-annotation" type="button" title="阅读批注" aria-label="切换到阅读批注皮肤" aria-pressed="false"><i class="swatch" style="background:#F3F1EB"></i>批注</button><button id="skin-focus" type="button" title="聚焦卡片" aria-label="切换到聚焦卡片皮肤" aria-pressed="false"><i class="swatch" style="background:#17202C"></i>聚焦</button></div></div><button id="settings-toggle" class="model-row" type="button" aria-expanded="false" aria-controls="settings"><span id="model-summary" class="model-entry">选择独立建议模型</span><span class="settings-entry">设置</span></button><button id="usage-open" class="usage-entry" type="button"><span id="usage-label">用量记录</span><span id="usage-arrow">查看</span></button></footer><div id="notice" class="toast" role="status" aria-live="polite" hidden></div><button id="close-panel" hidden>关闭面板</button><dialog id="discard-dialog" class="discard-layer" aria-labelledby="discard-title"><section class="discard-box"><h2 id="discard-title">放弃未保存的更改？</h2><p>当前修改还没有保存，返回后会恢复原设置。</p><div class="discard-actions"><button id="discard-continue" class="primary" type="button">继续编辑</button><button id="discard-confirm" class="secondary" type="button">放弃更改</button></div></section></dialog></main><script src="panel.js"></script></body></html>
